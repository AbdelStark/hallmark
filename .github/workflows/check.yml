name: research-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  circle-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAYON_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2025-07-14 --profile minimal
      - run: cargo +nightly-2025-07-14 test --manifest-path research/probes/circle/Cargo.toml --locked --release --features prover --tests -j 2
      - run: cargo +nightly-2025-07-14 build --manifest-path research/probes/circle/Cargo.toml --locked --release --features prover --bin circle-prove -j 2
      - run: cargo +nightly-2025-07-14 build --manifest-path research/probes/circle/Cargo.toml --locked --release --no-default-features --bin circle-verify -j 2
      - name: Verify a serialized gate proof in a separate verifier process
        env:
          PYTHONPATH: src:scripts
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tempfile
          from pathlib import Path
          from check_circle_engine import fixture, encode
          binaries = Path("research/probes/circle/target/release").resolve()
          prover, verifier = binaries / "circle-prove", binaries / "circle-verify"
          output = Path(tempfile.mkdtemp(prefix="circle-ci-"))
          program, public, witness = fixture()
          for name, value in (("program", program), ("public", public), ("witness", witness)):
              (output / (name + ".json")).write_bytes(encode(value))
          subprocess.run([prover, "enroll", "program.json", "enrollment.json"], cwd=output, check=True)
          pin = hashlib.sha256((output / "enrollment.json").read_bytes()).hexdigest()
          subprocess.run([prover, "prove", "program.json", "enrollment.json", "public.json", "witness.json", "proof.json"], cwd=output, check=True)
          args = [verifier, "enrollment.json", pin, "public.json", "proof.json"]
          subprocess.run(args, cwd=output, check=True)
          public[4] += 1
          (output / "public.json").write_bytes(encode(public))
          assert subprocess.run(args, cwd=output).returncode != 0
          print(json.dumps({"fresh_separate_verifier": "passed", "changed_public": "rejected", "qualified_backend": False}))
          PY
  llm-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: uv sync --locked --extra llm
      - run: uv run --locked --extra llm pytest tests/test_llm_e2e.py tests/test_sash_response.py
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: ['ubuntu-24.04', 'macos-15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: make check
      - run: make package-check
  train-fixture:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: ['ubuntu-24.04', 'macos-15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: make check-train
      - run: make package-check-train
  guard-fixture:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: make check-guard
      - run: make check-comparison
      - run: make package-check-comparison

  demo-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HALLMARK_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: uv sync --locked --project apps --python 3.12.12
      - run: command -v google-chrome
      - run: make check-demo
      - run: node --check apps/hallmark_demo/web/app.js
      - run: uv build --project apps --out-dir "$RUNNER_TEMP/hallmark-demo-dist"
      - run: uv run --locked --project apps hallmark-demo --help
