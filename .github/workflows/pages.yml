name: documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'research/**', 'website/**', '*.md', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', 'Makefile', 'scripts/build_docs.py', 'scripts/check_site.py', 'tests/test_docs_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'research/**', 'website/**', '*.md', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', 'Makefile', 'scripts/build_docs.py', 'scripts/check_site.py', 'tests/test_docs_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.18'
      - run: uv sync --locked --python 3.12.12
      - run: uv run --locked pytest tests/test_docs_site.py
      - run: uv sync --locked --project website --python 3.12.12
      - run: make docs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
