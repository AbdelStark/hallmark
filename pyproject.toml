[build-system]
requires = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13"]
build-backend = "hatchling.build"

[project]
name = "hallmark-research"
version = "0.1.0"
description = "Research on transcript-bound, verifiable classifier decisions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["cbor2>=5.6,<6", "pydantic>=2.10,<3", "cryptography==50.0.2"]

[project.optional-dependencies]
llm = ["huggingface-hub==2.2.0"]
train = ["numpy>=2,<3", "scikit-learn>=1.6,<2"]
guard = ["onnx==1.23.2", "onnxruntime==1.31.0", "tokenizers==0.23.3"]

[project.scripts]
hallmark = "hallmark.cli:main"

[dependency-groups]
build = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13"]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hallmark"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "configs", "docs", "research", "scripts", "website", ".agents", ".github", "AGENTS.md", "CLAUDE.md", "README.md", "index.md", "mkdocs.yml", "SPEC.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE.md", "CHANGELOG.md", "Makefile", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
enable_incomplete_feature = ["TypeForm"]

[[tool.mypy.overrides]]
module = ["cbor2", "numpy", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["train: requires the train extra, uses only synthetic local fixtures"]

[tool.coverage.run]
source = ["hallmark"]
branch = true

[tool.coverage.report]
show_missing = true
