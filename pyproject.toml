[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hallmark-research"
version = "0.1.0"
description = "Private research on transcript-bound, verifiable classifier decisions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "LicenseRef-Proprietary"
dependencies = ["cbor2>=5.6,<6", "pydantic>=2.10,<3"]

[project.optional-dependencies]
train = ["numpy>=2,<3", "scikit-learn>=1.6,<2"]

[project.scripts]
hallmark = "hallmark.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hallmark"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "configs", "docs", "research", "scripts", ".agents", ".github", "AGENTS.md", "CLAUDE.md", "README.md", "SPEC.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE.md", "CHANGELOG.md", "Makefile", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["cbor2", "numpy", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["train: requires the train extra, uses only synthetic local fixtures"]

[tool.coverage.run]
source = ["hallmark"]
branch = true

[tool.coverage.report]
show_missing = true
