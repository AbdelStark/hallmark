[package]
name = "hallmark-circle"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
prover = ["stwo/prover", "stwo/parallel", "stwo-constraint-framework/prover", "stwo-constraint-framework/parallel"]

[dependencies]
stwo = "=2.2.0"
stwo-constraint-framework = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"
sha2 = "=0.10.9"
num-traits = "=0.2.19"

[[bin]]
name = "circle-prove"
path = "src/bin/prove.rs"
required-features = ["prover"]

[[bin]]
name = "circle-verify"
path = "src/bin/verify.rs"

[profile.release]
codegen-units = 1
