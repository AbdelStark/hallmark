<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 270" role="img" aria-labelledby="title desc">
  <title id="title">Hallmark classifier proof pipeline</title>
  <desc id="desc">Synthetic training produces integer exports. Dedicated rule, MLP and CNN circuits generate three proofs. A separate verifier checks them against a caller-owned request and enrolled circuit and key pins, then returns the all-pass classifier decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; text-anchor: middle; }
      .label { font-size: 19px; font-weight: 600; }
      .detail { font-size: 15px; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1060" height="270" rx="12" fill="#f8fafc"/>
  <g class="flow">
    <path d="M 180 90 H 198"/>
    <path d="M 350 90 H 368"/>
    <path d="M 520 90 H 538"/>
    <path d="M 690 90 H 708"/>
    <path d="M 860 90 H 878"/>
    <path d="M 515 195 V 162 H 445 V 127"/>
    <path d="M 515 162 H 766 V 127"/>
    <path d="M 804 195 V 127"/>
  </g>
  <g>
    <rect class="box" x="30" y="55" width="150" height="70" rx="8"/>
    <text class="label" x="105" y="84">Train</text>
    <text class="detail" x="105" y="108">MLP + CNN</text>
    <text class="detail" x="105" y="36">Synthetic data</text>

    <rect class="box" x="200" y="55" width="150" height="70" rx="8"/>
    <text class="label" x="275" y="84">Export</text>
    <text class="detail" x="275" y="108">Exact integers</text>

    <rect class="box" x="370" y="55" width="150" height="70" rx="8"/>
    <text class="label" x="445" y="84">Prove</text>
    <text class="detail" x="445" y="108">Dedicated circuits</text>
    <text class="detail" x="445" y="36">Rule + MLP + CNN</text>

    <rect class="box" x="540" y="55" width="150" height="70" rx="8"/>
    <text class="label" x="615" y="84">Three proofs</text>
    <text class="detail" x="615" y="108">Groth16 / BLS12-381</text>

    <rect x="710" y="55" width="150" height="70" rx="8" fill="#eef8f5" stroke="#247a68" stroke-width="1.5"/>
    <text class="label" x="785" y="84">Verify</text>
    <text class="detail" x="785" y="108">Separate py-ecc</text>

    <rect x="880" y="55" width="150" height="70" rx="8" fill="#eef8f5" stroke="#247a68" stroke-width="1.5"/>
    <text class="label" x="955" y="84">All-pass gate</text>
    <text class="detail" x="955" y="108">Release or block</text>

    <rect class="box" x="350" y="195" width="330" height="48" rx="8"/>
    <text class="label" x="515" y="225">Caller-owned input + request</text>
    <rect class="box" x="730" y="195" width="300" height="48" rx="8"/>
    <text class="label" x="880" y="225">Enrolled circuit + key pins</text>
  </g>
</svg>
