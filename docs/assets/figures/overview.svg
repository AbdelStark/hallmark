<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="t d">
<title id="t">How Hallmark works</title>
<desc id="d">The caller pins the model, programs and request. SASH proves the TinyLlama response as 23 linked Circle STARK segments; STWO proves the rule, MLP and CNN verdicts. The verifier checks every proof against the caller&#x27;s expectations and checks that both refer to the same request.</desc>
<style>svg{--bg:#f7f4ec;--panel:#fffdf8;--ink:#203c35;--text:#2b3d36;--muted:#5b6860;--faint:#8d988f;--line:#d4d9cc;--grid:#e4e6dc;--soft:#ebede2;--soft2:#dde3d4;--layer:#c9d8cb;--accent:#b5532f;--accent-soft:#f4e0d6;--proved:#2e6b52;--proved-soft:#e2ece3;--caller:#94680f;--caller-soft:#f5ebcf;--out:#8d988f;--out-soft:#efeee7;--s1:#3a6fb0;--s2:#c8602f;--s3:#249c70;--s4:#d9a01c;--cpu:#a3aba4}@media (prefers-color-scheme:dark){svg{--bg:#172822;--panel:#1c3029;--ink:#e6ebdc;--text:#d9e2d4;--muted:#a7b6a9;--faint:#7d8c80;--line:#3a4d41;--grid:#26392f;--soft:#22372d;--soft2:#2b4337;--layer:#33503f;--accent:#f0b398;--accent-soft:#4a2e24;--proved:#86c9a6;--proved-soft:#1f3d2e;--caller:#e2b85c;--caller-soft:#3a3320;--out:#7d8c80;--out-soft:#203029;--s1:#4f86c9;--s2:#d26a3a;--s3:#2aa577;--s4:#b98c18;--cpu:#66756a}}text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:14px}.e{font-size:11px;font-weight:700;letter-spacing:.13em;fill:var(--muted)}.h{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}.b{font-size:14px}.bs{font-size:13px}.s{font-size:12px;fill:var(--muted)}.bb{font-size:14px;font-weight:650;fill:var(--ink)}.hb{font-size:16px;font-weight:650;fill:var(--ink)}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:var(--ink)}.mbig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:600;fill:var(--ink)}.big{font-size:24px;font-weight:600;fill:var(--ink)}.acc{fill:var(--accent)}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.prv{fill:var(--proved)}.cal{fill:var(--caller)}.w{font-weight:650}.onw{fill:#ffffff}.ond{fill:#1d1a10}.f-bg{fill:var(--bg)}.k-bg{stroke:var(--bg)}.f-panel{fill:var(--panel)}.k-panel{stroke:var(--panel)}.f-ink{fill:var(--ink)}.k-ink{stroke:var(--ink)}.f-text{fill:var(--text)}.k-text{stroke:var(--text)}.f-muted{fill:var(--muted)}.k-muted{stroke:var(--muted)}.f-faint{fill:var(--faint)}.k-faint{stroke:var(--faint)}.f-line{fill:var(--line)}.k-line{stroke:var(--line)}.f-grid{fill:var(--grid)}.k-grid{stroke:var(--grid)}.f-soft{fill:var(--soft)}.k-soft{stroke:var(--soft)}.f-soft2{fill:var(--soft2)}.k-soft2{stroke:var(--soft2)}.f-layer{fill:var(--layer)}.k-layer{stroke:var(--layer)}.f-accent{fill:var(--accent)}.k-accent{stroke:var(--accent)}.f-accent_soft{fill:var(--accent-soft)}.k-accent_soft{stroke:var(--accent-soft)}.f-proved{fill:var(--proved)}.k-proved{stroke:var(--proved)}.f-proved_soft{fill:var(--proved-soft)}.k-proved_soft{stroke:var(--proved-soft)}.f-caller{fill:var(--caller)}.k-caller{stroke:var(--caller)}.f-caller_soft{fill:var(--caller-soft)}.k-caller_soft{stroke:var(--caller-soft)}.f-out{fill:var(--out)}.k-out{stroke:var(--out)}.f-out_soft{fill:var(--out-soft)}.k-out_soft{stroke:var(--out-soft)}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1)}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2)}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3)}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4)}.f-cpu{fill:var(--cpu)}.k-cpu{stroke:var(--cpu)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-faint"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker></defs>
<rect width="960" height="452" rx="10" class="f-bg"/>
<text x="40" y="44" class="e">HALLMARK · ONE REQUEST, TWO PROVED COMPUTATIONS</text>
<text x="40" y="72" class="h">Pin the expectation first. Prove. Then check everything against one request.</text>
<text x="40" y="116" class="e">1 · CALLER</text>
<text x="280" y="116" class="e">2 · PROVERS</text>
<text x="730" y="116" class="e">3 · VERIFIER</text>
<rect x="40" y="128" width="200" height="272" class="f-caller_soft k-caller" rx="8" stroke-width="1"/>
<path d="M58 153l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="162" class="bs"><tspan x="72" dy="0">Model, shape and</tspan><tspan x="72" dy="16">calibration roots</tspan></text>
<path d="M58 205l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="214" class="bs"><tspan x="72" dy="0">Classifier programs and</tspan><tspan x="72" dy="16">preprocessing roots</tspan></text>
<path d="M58 257l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="266" class="bs"><tspan x="72" dy="0">Prompt, response</tspan><tspan x="72" dy="16">and token IDs</tspan></text>
<path d="M58 309l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="318" class="bs"><tspan x="72" dy="0">Concrete proof</tspan><tspan x="72" dy="16">parameters</tspan></text>
<text x="56" y="382" class="s">Pinned before any proof exists</text>
<rect x="280" y="128" width="410" height="128" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="296" y="152" class="e">TINYLLAMA-1.1B · SASH CIRCLE STARK</text>
<rect x="296" y="166" width="112" height="46" class="f-soft k-line" rx="6" stroke-width="1"/>
<text x="352" y="185.5" class="bb" text-anchor="middle">25 prompt</text>
<text x="352" y="202.5" class="bs" text-anchor="middle">tokens</text>
<rect x="430" y="166" width="120" height="46" class="f-layer k-line" rx="6" stroke-width="1"/>
<text x="490" y="185.5" class="bb" text-anchor="middle">22 layers</text>
<text x="490" y="202.5" class="bs" text-anchor="middle">+ norm + head</text>
<rect x="572" y="166" width="104" height="46" class="f-accent_soft k-line" rx="6" stroke-width="1"/>
<text x="624" y="185.5" class="bb" text-anchor="middle">8 tokens</text>
<text x="624" y="202.5" class="bs" text-anchor="middle">through EOS</text>
<path d="M408 189L428 189" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M550 189L570 189" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<text x="296" y="238" class="s">23 linked segment proofs · 737.86 MB of proof JSON</text>
<rect x="280" y="272" width="410" height="128" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="296" y="296" class="e">RULE · MLP · CNN · STWO CIRCLE STARK</text>
<rect x="296" y="310" width="112" height="46" class="f-soft k-line" rx="6" stroke-width="1"/>
<text x="352" y="329.5" class="bb" text-anchor="middle">Prompt bytes</text>
<text x="352" y="346.5" class="bs" text-anchor="middle">≤ 96, UTF-8</text>
<rect x="430" y="310" width="120" height="46" class="f-layer k-line" rx="6" stroke-width="1"/>
<text x="490" y="329.5" class="bb" text-anchor="middle">SHA-256 +</text>
<text x="490" y="346.5" class="bs" text-anchor="middle">integer model</text>
<rect x="572" y="310" width="104" height="46" class="f-accent_soft k-line" rx="6" stroke-width="1"/>
<text x="624" y="329.5" class="bb" text-anchor="middle">Verdict</text>
<text x="624" y="346.5" class="bs" text-anchor="middle">pass or block</text>
<path d="M408 333L428 333" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M550 333L570 333" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<text x="296" y="382" class="s">One proof per classifier per request · about 2 MB each</text>
<rect x="730" y="128" width="190" height="272" class="f-proved_soft k-proved" rx="8" stroke-width="1"/>
<path d="M746 156l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="764" y="162" class="bs"><tspan x="764" dy="0">Every proof against</tspan><tspan x="764" dy="16">the enrolled roots</tspan></text>
<path d="M746 208l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="764" y="214" class="bs"><tspan x="764" dy="0">Residual, token and</tspan><tspan x="764" dy="16">roster links</tspan></text>
<path d="M746 260l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="764" y="266" class="bs"><tspan x="764" dy="0">Both proofs name</tspan><tspan x="764" dy="16">the same request</tspan></text>
<rect x="744" y="328" width="162" height="56" class="f-ink" rx="6"/>
<text x="825" y="351" class="bb" style="fill:var(--bg)" text-anchor="middle">Verified response</text>
<text x="825" y="369" class="bs" style="fill:var(--bg)" text-anchor="middle">+ three verdicts</text>
<path d="M242 192L277 192" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M692 192L727 192" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M242 336L277 336" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M692 336L727 336" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M140 402V424H825V402" class="k-caller" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 4" stroke-linecap="round"/>
<rect x="372" y="414" width="220" height="20" class="f-bg"/>
<text x="482" y="428" class="s" text-anchor="middle">the same expectations, unchanged</text>
</svg>
