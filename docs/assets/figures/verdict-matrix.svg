<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="t d">
<title id="t">Nine proofs, nine verdicts</title>
<desc id="d">Three requests times three classifiers. All nine proofs verify. The allow request passes all three classifiers; the CNN blocks the contextual case; the rule blocks the BAD-prefixed case. A blocking verdict is a proved outcome, not a failed proof.</desc>
