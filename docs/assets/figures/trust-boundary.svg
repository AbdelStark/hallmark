<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" width="960" height="474" role="img" aria-labelledby="t d">
<title id="t">Where the proof ends</title>
<desc id="d">Three columns. Proved by the STARK: the quantized TinyLlama computation and links, and each classifier&#x27;s input coverage, commitment, arithmetic and verdict. Checked by the caller: enrollment, tokenization, request binding, rosters and the all-pass policy. Not claimed: float equivalence, hiding, hardware provenance, input authenticity, training history, policy quality, independent review and arbitrary models.</desc>
<style>svg{--bg:#f7f4ec;--panel:#fffdf8;--ink:#203c35;--text:#2b3d36;--muted:#5b6860;--faint:#8d988f;--line:#d4d9cc;--grid:#e4e6dc;--soft:#ebede2;--soft2:#dde3d4;--layer:#c9d8cb;--accent:#b5532f;--accent-soft:#f4e0d6;--proved:#2e6b52;--proved-soft:#e2ece3;--caller:#94680f;--caller-soft:#f5ebcf;--out:#8d988f;--out-soft:#efeee7;--s1:#3a6fb0;--s2:#c8602f;--s3:#249c70;--s4:#d9a01c;--cpu:#a3aba4}@media (prefers-color-scheme:dark){svg{--bg:#172822;--panel:#1c3029;--ink:#e6ebdc;--text:#d9e2d4;--muted:#a7b6a9;--faint:#7d8c80;--line:#3a4d41;--grid:#26392f;--soft:#22372d;--soft2:#2b4337;--layer:#33503f;--accent:#f0b398;--accent-soft:#4a2e24;--proved:#86c9a6;--proved-soft:#1f3d2e;--caller:#e2b85c;--caller-soft:#3a3320;--out:#7d8c80;--out-soft:#203029;--s1:#4f86c9;--s2:#d26a3a;--s3:#2aa577;--s4:#b98c18;--cpu:#66756a}}text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:14px}.e{font-size:11px;font-weight:700;letter-spacing:.13em;fill:var(--muted)}.h{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}.b{font-size:14px}.bs{font-size:13px}.s{font-size:12px;fill:var(--muted)}.bb{font-size:14px;font-weight:650;fill:var(--ink)}.hb{font-size:16px;font-weight:650;fill:var(--ink)}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:var(--ink)}.mbig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:600;fill:var(--ink)}.big{font-size:24px;font-weight:600;fill:var(--ink)}.acc{fill:var(--accent)}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.prv{fill:var(--proved)}.cal{fill:var(--caller)}.w{font-weight:650}.onw{fill:#ffffff}.ond{fill:#1d1a10}.f-bg{fill:var(--bg)}.k-bg{stroke:var(--bg)}.f-panel{fill:var(--panel)}.k-panel{stroke:var(--panel)}.f-ink{fill:var(--ink)}.k-ink{stroke:var(--ink)}.f-text{fill:var(--text)}.k-text{stroke:var(--text)}.f-muted{fill:var(--muted)}.k-muted{stroke:var(--muted)}.f-faint{fill:var(--faint)}.k-faint{stroke:var(--faint)}.f-line{fill:var(--line)}.k-line{stroke:var(--line)}.f-grid{fill:var(--grid)}.k-grid{stroke:var(--grid)}.f-soft{fill:var(--soft)}.k-soft{stroke:var(--soft)}.f-soft2{fill:var(--soft2)}.k-soft2{stroke:var(--soft2)}.f-layer{fill:var(--layer)}.k-layer{stroke:var(--layer)}.f-accent{fill:var(--accent)}.k-accent{stroke:var(--accent)}.f-accent_soft{fill:var(--accent-soft)}.k-accent_soft{stroke:var(--accent-soft)}.f-proved{fill:var(--proved)}.k-proved{stroke:var(--proved)}.f-proved_soft{fill:var(--proved-soft)}.k-proved_soft{stroke:var(--proved-soft)}.f-caller{fill:var(--caller)}.k-caller{stroke:var(--caller)}.f-caller_soft{fill:var(--caller-soft)}.k-caller_soft{stroke:var(--caller-soft)}.f-out{fill:var(--out)}.k-out{stroke:var(--out)}.f-out_soft{fill:var(--out-soft)}.k-out_soft{stroke:var(--out-soft)}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1)}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2)}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3)}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4)}.f-cpu{fill:var(--cpu)}.k-cpu{stroke:var(--cpu)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-faint"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker></defs>
<rect width="960" height="474" rx="10" class="f-bg"/>
<text x="40" y="44" class="e">WHERE THE PROOF ENDS</text>
<text x="40" y="72" class="h">What is proved, what the caller checks, what is not claimed</text>
<rect x="40" y="104" width="280" height="324" class="f-proved_soft k-proved" rx="8" stroke-width="1"/>
<text x="58" y="130" class="e">PROVED BY THE STARK</text>
<text x="58" y="160" class="bb">TinyLlama, quantized</text>
<path d="M58 179l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="184" class="bs">Embedding, 22 layers, final norm</text>
<path d="M58 203l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="208" class="bs">Output argmax at positions 24–31</text>
<path d="M58 227l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="232" class="bs">22 residual links between segments</text>
<path d="M58 251l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="256" class="bs">7 outputs equal the next inputs</text>
<text x="58" y="280" class="bb">Each classifier</text>
<path d="M58 299l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="304" class="bs">Every byte of the ≤ 96-byte prompt</text>
<path d="M58 323l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="328" class="bs">Salted SHA-256 input commitment</text>
<path d="M58 347l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="352" class="bs">Every integer operation</text>
<path d="M58 371l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="376" class="bs">Verdict from the threshold</text>
<rect x="340" y="104" width="280" height="324" class="f-caller_soft k-caller" rx="8" stroke-width="1"/>
<text x="358" y="130" class="e">CHECKED BY THE CALLER</text>
<path d="M362 150l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="160" class="bs">Enroll roots, programs and</text>
<text x="378" y="178" class="bs">parameters before proving</text>
<path d="M362 194l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="204" class="bs">Tokenizer and chat template</text>
<path d="M362 220l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="230" class="bs">Last output token is EOS</text>
<path d="M362 246l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="256" class="bs">Rebuild context, salts, classifier IDs</text>
<path d="M362 272l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="282" class="bs">Exactly one proof per classifier</text>
<path d="M362 298l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="308" class="bs">Both proofs name one request</text>
<path d="M362 324l4 4.5l-4 4.5l-4-4.5z" class="f-caller k-caller" stroke-width="1" stroke-linecap="round"/>
<text x="378" y="334" class="bs">Combine verdicts with all-pass</text>
<rect x="640" y="104" width="280" height="324" class="f-out_soft k-out" rx="8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="658" y="130" class="e">NOT CLAIMED</text>
<path d="M658 151l7 7M665 151l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="160" class="bs">Equality with the float model</text>
<path d="M658 177l7 7M665 177l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="186" class="bs">Witness hiding (no ZK claim)</text>
<path d="M658 203l7 7M665 203l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="212" class="bs">Hardware provenance</text>
<path d="M658 229l7 7M665 229l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="238" class="bs">Authentic input capture</text>
<path d="M658 255l7 7M665 255l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="264" class="bs">Training history</text>
<path d="M658 281l7 7M665 281l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="290" class="bs">Policy or classifier quality</text>
<path d="M658 307l7 7M665 307l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="316" class="bs">Independent security review</text>
<path d="M658 333l7 7M665 333l-7 7" class="k-out" fill="none" stroke-width="1.8" stroke-linecap="round"/>
<text x="678" y="342" class="bs">Arbitrary prompts or models</text>
<text x="40" y="454" class="s">A proof never authenticates its own enrollment: roots or keys supplied only by the prover establish nothing.</text>
</svg>
