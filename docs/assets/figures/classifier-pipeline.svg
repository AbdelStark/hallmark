<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="t d">
<title id="t">The classifier workflow</title>
<desc id="d">Train and export the MLP and CNN, compile gates and build the prover and verifier, enroll the programs before proving; then for each of nine request/classifier pairs build the witness, prove with STWO, verify in a fresh process and bind the result.</desc>
<style>svg{--bg:#f7f4ec;--panel:#fffdf8;--ink:#203c35;--text:#2b3d36;--muted:#5b6860;--faint:#8d988f;--line:#d4d9cc;--grid:#e4e6dc;--soft:#ebede2;--soft2:#dde3d4;--layer:#c9d8cb;--accent:#b5532f;--accent-soft:#f4e0d6;--proved:#2e6b52;--proved-soft:#e2ece3;--caller:#94680f;--caller-soft:#f5ebcf;--out:#8d988f;--out-soft:#efeee7;--s1:#3a6fb0;--s2:#c8602f;--s3:#249c70;--s4:#d9a01c;--cpu:#a3aba4}@media (prefers-color-scheme:dark){svg{--bg:#172822;--panel:#1c3029;--ink:#e6ebdc;--text:#d9e2d4;--muted:#a7b6a9;--faint:#7d8c80;--line:#3a4d41;--grid:#26392f;--soft:#22372d;--soft2:#2b4337;--layer:#33503f;--accent:#f0b398;--accent-soft:#4a2e24;--proved:#86c9a6;--proved-soft:#1f3d2e;--caller:#e2b85c;--caller-soft:#3a3320;--out:#7d8c80;--out-soft:#203029;--s1:#4f86c9;--s2:#d26a3a;--s3:#2aa577;--s4:#b98c18;--cpu:#66756a}}text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:14px}.e{font-size:11px;font-weight:700;letter-spacing:.13em;fill:var(--muted)}.h{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}.b{font-size:14px}.bs{font-size:13px}.s{font-size:12px;fill:var(--muted)}.bb{font-size:14px;font-weight:650;fill:var(--ink)}.hb{font-size:16px;font-weight:650;fill:var(--ink)}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}.mb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:var(--ink)}.mbig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:600;fill:var(--ink)}.big{font-size:24px;font-weight:600;fill:var(--ink)}.acc{fill:var(--accent)}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.prv{fill:var(--proved)}.cal{fill:var(--caller)}.w{font-weight:650}.onw{fill:#ffffff}.ond{fill:#1d1a10}.f-bg{fill:var(--bg)}.k-bg{stroke:var(--bg)}.f-panel{fill:var(--panel)}.k-panel{stroke:var(--panel)}.f-ink{fill:var(--ink)}.k-ink{stroke:var(--ink)}.f-text{fill:var(--text)}.k-text{stroke:var(--text)}.f-muted{fill:var(--muted)}.k-muted{stroke:var(--muted)}.f-faint{fill:var(--faint)}.k-faint{stroke:var(--faint)}.f-line{fill:var(--line)}.k-line{stroke:var(--line)}.f-grid{fill:var(--grid)}.k-grid{stroke:var(--grid)}.f-soft{fill:var(--soft)}.k-soft{stroke:var(--soft)}.f-soft2{fill:var(--soft2)}.k-soft2{stroke:var(--soft2)}.f-layer{fill:var(--layer)}.k-layer{stroke:var(--layer)}.f-accent{fill:var(--accent)}.k-accent{stroke:var(--accent)}.f-accent_soft{fill:var(--accent-soft)}.k-accent_soft{stroke:var(--accent-soft)}.f-proved{fill:var(--proved)}.k-proved{stroke:var(--proved)}.f-proved_soft{fill:var(--proved-soft)}.k-proved_soft{stroke:var(--proved-soft)}.f-caller{fill:var(--caller)}.k-caller{stroke:var(--caller)}.f-caller_soft{fill:var(--caller-soft)}.k-caller_soft{stroke:var(--caller-soft)}.f-out{fill:var(--out)}.k-out{stroke:var(--out)}.f-out_soft{fill:var(--out-soft)}.k-out_soft{stroke:var(--out-soft)}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1)}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2)}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3)}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4)}.f-cpu{fill:var(--cpu)}.k-cpu{stroke:var(--cpu)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-faint"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker></defs>
<rect width="960" height="452" rx="10" class="f-bg"/>
<text x="40" y="44" class="e">MAKE E2E · THE CLASSIFIER WORKFLOW</text>
<text x="40" y="72" class="h">Train once, enroll before proving, then prove and check nine decisions</text>
<text x="40" y="110" class="e">ONCE PER RUN</text>
<rect x="40" y="122" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="54" y="148" class="bb">Train</text>
<text x="54" y="172" class="s"><tspan x="54" dy="0">MLP 1.95 s</tspan><tspan x="54" dy="16">CNN 172.94 s</tspan><tspan x="54" dy="16">synthetic data, seed 17</tspan></text>
<path d="M242 172L263 172" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="266" y="122" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="280" y="148" class="bb">Export</text>
<text x="280" y="172" class="s"><tspan x="280" dy="0">exact integer graphs</tspan><tspan x="280" dy="16">weights become</tspan><tspan x="280" dy="16">circuit constants</tspan></text>
<path d="M468 172L489 172" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="492" y="122" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="506" y="148" class="bb">Compile and build</text>
<text x="506" y="172" class="s"><tspan x="506" dy="0">SHA-256 + integer gates</tspan><tspan x="506" dy="16">prover 24.82 s</tspan><tspan x="506" dy="16">verifier 9.57 s</tspan></text>
<path d="M694 172L715 172" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="718" y="122" width="200" height="100" class="f-caller_soft k-caller" rx="8" stroke-width="1"/>
<text x="732" y="148" class="bb">Enroll</text>
<text x="732" y="172" class="s"><tspan x="732" dy="0">program hash and</tspan><tspan x="732" dy="16">preprocessing root</tspan><tspan x="732" dy="16">3 programs · 3.88 s</tspan></text>
<rect x="40" y="268" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="54" y="294" class="bb">Witness</text>
<text x="54" y="318" class="s"><tspan x="54" dy="0">complete trace and</tspan><tspan x="54" dy="16">native parity check</tspan><tspan x="54" dy="16">15.61 s for nine</tspan></text>
<path d="M242 318L263 318" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="266" y="268" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="280" y="294" class="bb">Prove · STWO</text>
<text x="280" y="318" class="s"><tspan x="280" dy="0">commit, LogUp, FRI</tspan><tspan x="280" dy="16">50.03 s for nine</tspan><tspan x="280" dy="16">24.06 s final proving</tspan></text>
<path d="M468 318L489 318" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="492" y="268" width="200" height="100" class="f-panel k-line" rx="8" stroke-width="1"/>
<text x="506" y="294" class="bb">Verify · fresh process</text>
<text x="506" y="318" class="s"><tspan x="506" dy="0">proof + enrollment +</tspan><tspan x="506" dy="16">public inputs only</tspan><tspan x="506" dy="16">0.807 s for nine</tspan></text>
<path d="M694 318L715 318" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<rect x="718" y="268" width="200" height="100" class="f-caller_soft k-caller" rx="8" stroke-width="1"/>
<text x="732" y="294" class="bb">Bind and decide</text>
<text x="732" y="318" class="s"><tspan x="732" dy="0">rebuild public inputs</tspan><tspan x="732" dy="16">exact roster</tspan><tspan x="732" dy="16">all-pass → release</tspan></text>
<path d="M818 224V240H140V264" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<text x="160" y="258" class="e">PER PROOF · 3 REQUESTS × 3 CLASSIFIERS</text>
<rect x="40" y="384" width="880" height="34" class="f-proved_soft k-proved" rx="6" stroke-width="1"/>
<path d="M56 400l3.5 3.5l6.5-7" class="k-proved" fill="none" stroke-width="2" stroke-linecap="round"/>
<text x="76" y="406" class="bs"><tspan class="bb">Must reject, and did: </tspan>63 changed public inputs · 18 cross-request swaps · 3 invalid rosters</text>
<text x="40" y="440" class="s">Timings: C1, one fresh run on an Apple M4 Max with four prover threads, 2026-10-28. Nine proof files total 18.06 MB. Amber cards are caller steps.</text>
</svg>
