<rect width="960" height="418" rx="10" class="f-bg"/>
<text x="40" y="44" class="e">A100 · NINE CIRCLE CLASSIFIER PROOFS · THREE CPU/CUDA PAIRS</text>
<text x="40" y="72" class="h">CUDA runs the nine prover commands 4.16× faster: 92.41 s → 22.22 s</text>
<rect x="120" y="98" width="12" height="12" class="f-cpu" rx="2"/>
<text x="138" y="108" class="bs">CPU · SIMD</text>
<rect x="230.2" y="98" width="12" height="12" class="f-s2" rx="2"/>
<text x="248.2" y="108" class="bs">GPU · CUDA</text>
<path d="M120 128L120 310" class="k-grid" fill="none" stroke-width="1" stroke-linecap="round"/>
<text x="120" y="328" class="s" text-anchor="middle">0 s</text>
