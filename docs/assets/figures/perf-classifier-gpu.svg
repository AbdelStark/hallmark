<text x="179.24" y="172" class="m">2.049 s</text>
<text x="40" y="222" class="bb">MLP</text>
<path d="M120 198H307.5A4 4 0 0 1 311.5 202V212A4 4 0 0 1 307.5 216H120Z" class="f-cpu"/>
<text x="319.5" y="212" class="m">7.660 s</text>
<path d="M120 220H168.72A4 4 0 0 1 172.72 224V234A4 4 0 0 1 168.72 238H120Z" class="f-s2"/>
<text x="180.72" y="234" class="m">2.109 s</text>
<text x="40" y="284" class="bb">CNN</text>
<path d="M120 260H505.17A4 4 0 0 1 509.17 264V274A4 4 0 0 1 505.17 278H120Z" class="f-cpu"/>
<text x="517.17" y="274" class="m">15.567 s</text>
<path d="M120 282H196.12A4 4 0 0 1 200.12 286V296A4 4 0 0 1 196.12 300H120Z" class="f-s2"/>
<text x="208.12" y="296" class="m">3.205 s</text>
<text x="120" y="350" class="s">median complete prover command, one proof</text>
<rect x="600" y="104" width="320" height="72" class="f-panel k-line" rx="6" stroke-width="1"/>
<text x="616" y="125" class="s">Nine prover commands</text>
<text x="616" y="149" class="mbig">92.41 → 22.22 s</text>
<text x="616" y="167" class="s">4.16× ratio of medians</text>
<rect x="600" y="186" width="320" height="72" class="f-panel k-line" rx="6" stroke-width="1"/>
<text x="616" y="207" class="s">Nine final STWO calls, inside the commands</text>
<text x="616" y="231" class="mbig">44.31 → 7.55 s</text>
<text x="616" y="249" class="s">5.87× ratio of medians</text>
<rect x="600" y="268" width="320" height="72" class="f-panel k-line" rx="6" stroke-width="1"/>
<text x="616" y="289" class="s">Peak sampled prover RSS</text>
<text x="616" y="313" class="mbig">19.46 → 0.62 GB</text>
<text x="616" y="331" class="s">plus 18.25 GiB of device memory</text>
<text x="40" y="380" class="s"><tspan x="40" dy="0">All 54 proofs verify on Linux and on a stock Mac verifier; all 378 public-input mutations reject. Training, Python witness preparation</tspan><tspan x="40" dy="16">and verification are excluded. Per-classifier medians pool three requests × three repetitions.</tspan></text>
