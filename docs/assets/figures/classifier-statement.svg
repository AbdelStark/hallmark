:var(--text)}.f-muted{fill:var(--muted)}.k-muted{stroke:var(--muted)}.f-faint{fill:var(--faint)}.k-faint{stroke:var(--faint)}.f-line{fill:var(--line)}.k-line{stroke:var(--line)}.f-grid{fill:var(--grid)}.k-grid{stroke:var(--grid)}.f-soft{fill:var(--soft)}.k-soft{stroke:var(--soft)}.f-soft2{fill:var(--soft2)}.k-soft2{stroke:var(--soft2)}.f-layer{fill:var(--layer)}.k-layer{stroke:var(--layer)}.f-accent{fill:var(--accent)}.k-accent{stroke:var(--accent)}.f-accent_soft{fill:var(--accent-soft)}.k-accent_soft{stroke:var(--accent-soft)}.f-proved{fill:var(--proved)}.k-proved{stroke:var(--proved)}.f-proved_soft{fill:var(--proved-soft)}.k-proved_soft{stroke:var(--proved-soft)}.f-caller{fill:var(--caller)}.k-caller{stroke:var(--caller)}.f-caller_soft{fill:var(--caller-soft)}.k-caller_soft{stroke:var(--caller-soft)}.f-out{fill:var(--out)}.k-out{stroke:var(--out)}.f-out_soft{fill:var(--out-soft)}.k-out_soft{stroke:var(--out-soft)}.f-s1{fill:var(--s1)}.k-s1{stroke:var(--s1)}.f-s2{fill:var(--s2)}.k-s2{stroke:var(--s2)}.f-s3{fill:var(--s3)}.k-s3{stroke:var(--s3)}.f-s4{fill:var(--s4)}.k-s4{stroke:var(--s4)}.f-cpu{fill:var(--cpu)}.k-cpu{stroke:var(--cpu)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-faint"/></marker><marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker></defs>
<rect width="960" height="488" rx="10" class="f-bg"/>
<text x="40" y="44" class="e">WHAT ONE CLASSIFIER PROOF STATES</text>
<text x="40" y="72" class="h">Exact integer inference on the complete prompt, bound to a commitment</text>
<rect x="40" y="108" width="196" height="316" class="f-out_soft k-out" rx="8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="132" class="e">WITNESS</text>
<text x="56" y="156" class="bs"><tspan x="56" dy="0">Prompt bytes x</tspan><tspan x="56" dy="17">(0–96 UTF-8 bytes)</tspan></text>
<text x="56" y="206" class="bs">Opening salt</text>
<text x="56" y="236" class="bs">Padding and masks</text>
<text x="56" y="266" class="bs"><tspan x="56" dy="0">Every intermediate</tspan><tspan x="56" dy="17">value</tspan></text>
<text x="56" y="352" class="s"><tspan x="56" dy="0">Not in the public</tspan><tspan x="56" dy="16">statement. Not hidden</tspan><tspan x="56" dy="16">either: no ZK claim.</tspan></text>
<text x="268" y="132" class="e">CONSTRAINED BY THE CIRCUIT</text>
<rect x="268" y="146" width="372" height="62" class="f-panel k-line" rx="6" stroke-width="1"/>
<circle cx="290" cy="166" r="11" class="f-ink"/>
<text x="290" y="171" class="bs w" style="fill:var(--bg)" text-anchor="middle">1</text>
<text x="310" y="171" class="bb">Complete input</text>
<text x="310" y="190" class="s">96 byte slots, exact length, zero padding.</text>
<text x="310" y="204" class="s">Nothing is truncated.</text>
<rect x="268" y="216" width="372" height="62" class="f-panel k-line" rx="6" stroke-width="1"/>
<circle cx="290" cy="236" r="11" class="f-ink"/>
<text x="290" y="241" class="bs w" style="fill:var(--bg)" text-anchor="middle">2</text>
<text x="310" y="241" class="bb">Commitment</text>
<text x="310" y="260" class="s">SHA-256 over salt + canonical CBOR(x)</text>
<text x="310" y="274" class="s">equals the public input digest.</text>
<rect x="268" y="286" width="372" height="62" class="f-panel k-line" rx="6" stroke-width="1"/>
<circle cx="290" cy="306" r="11" class="f-ink"/>
<text x="290" y="311" class="bs w" style="fill:var(--bg)" text-anchor="middle">3</text>
<text x="310" y="311" class="bb">Classifier</text>
<text x="310" y="330" class="s">rule: no “BAD” at any offset · MLP: byte</text>
<text x="310" y="344" class="s">counts → 4 ReLU · CNN: conv → masked max</text>
<rect x="268" y="356" width="372" height="62" class="f-panel k-line" rx="6" stroke-width="1"/>
<circle cx="290" cy="376" r="11" class="f-ink"/>
<text x="290" y="381" class="bs w" style="fill:var(--bg)" text-anchor="middle">4</text>
<text x="310" y="381" class="bb">Decision</text>
<text x="310" y="400" class="s">verdict = 1 if score &lt; threshold, else 0.</text>
<text x="310" y="414" class="s">Equality blocks.</text>
<path d="M238 266L264 266" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
<path d="M642 266L668 266" class="k-faint" fill="none" stroke-width="1.5" marker-end="url(#a)" stroke-linecap="round"/>
