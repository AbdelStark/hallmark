<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="t d">
<title id="t">What one classifier proof states</title>
<desc id="d">The witness holds the prompt bytes, salt and intermediate values. The circuit constrains complete input coverage, a salted SHA-256 commitment, the exact integer classifier and the threshold decision. The public statement has 100 fields: context, classifier and input digests of 32 bytes each, plus counts, threshold and verdict.</desc>
