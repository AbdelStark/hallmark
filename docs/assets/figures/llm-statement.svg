<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="t d">
<title id="t">What the TinyLlama proof covers</title>
<desc id="d">One 32-position block holds the 25 prompt tokens and the first seven answer tokens. Twenty-two layer segments and one final-norm/output-head segment are proved, joined by 22 residual links. The head&#x27;s argmax at positions 24 to 31 yields the eight answer tokens through EOS; seven of them must equal the next input token.</desc>
