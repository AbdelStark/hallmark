<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="960" height="364" role="img" aria-labelledby="t d">
<title id="t">What a complete LLM segment command contains</title>
<desc id="d">Stacked bars for CPU and GPU complete segment commands, summed over 23 segments: trace generation, proving session, inline verification and the remainder by subtraction.</desc>
