<text x="40" y="326" class="s"><tspan x="40" dy="0">Seconds, summed over 23 segments. Remainder = complete command − (trace + session + inline verification): loading, serialization and</tspan><tspan x="40" dy="16">unattributed time, by subtraction.</tspan></text>
